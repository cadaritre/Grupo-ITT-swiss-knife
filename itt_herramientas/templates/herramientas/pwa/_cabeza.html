{% load static herramientas %}{% perfil_clave as clave %}<link rel="manifest" href="{% url 'herramientas:manifiesto' %}{% if clave != 'grupo_itt' %}?p={{ clave }}{% endif %}">
<meta name="theme-color" content="#07356F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Herramientas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
{% with icono="herramientas/img/apple-touch-icon-"|add:clave|add:".png" %}<link rel="apple-touch-icon" href="{% static icono %}">{% endwith %}
<link rel="stylesheet" href="{% static 'herramientas/offline/pwa.css' %}">
<script src="{% static 'herramientas/cad/sesion.js' %}" defer></script>
{% if request.user.is_authenticated %}<link rel="stylesheet" href="{% url 'herramientas:perfil_css' %}">{% endif %}
