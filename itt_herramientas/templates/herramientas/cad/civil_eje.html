{% load tv %}<div class="civil-elecciones">
  <div class="civil-eleccion"><div><strong>Eje</strong><span class="tv-tenue" data-civil-cuenta="eje">Sin elegir</span></div><button type="button" class="tv-boton" data-civil-elegir="eje">{% icono "mouse-pointer-click" %}<span>Elegir</span></button></div>
</div>
<div class="civil-fila">
  <div class="tv-campo"><label for="civil-{{ pre }}-inicio">Cadenamiento inicial</label><input id="civil-{{ pre }}-inicio" name="inicio" value="0+000.00" autocomplete="off" inputmode="decimal" data-civil-estacion></div>
  <div class="tv-campo"><label for="civil-{{ pre }}-int">Estación cada</label><div class="civil-unidad"><input id="civil-{{ pre }}-int" name="intervalo" type="number" min="0.1" step="any" value="20" inputmode="decimal"><span>m</span></div></div>
</div>
