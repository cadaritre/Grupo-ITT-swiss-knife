[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "itt-herramientas-web"
version = "0.1.0"
description = "Herramientas Grupo ITT: cotizaciones, reportes fotográficos, croquis, convertidor y triangulación como app Django para el Portal TresVizo"
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Propietaria"
dependencies = [
    "Pillow>=12.2,<14",
    "reportlab>=4.4,<6",
    "ezdxf>=1.4,<2",
    "numpy>=2.0,<3",
    "pyproj>=3.7,<4",
    "Shapely>=2.1,<3",
    "pyspellchecker>=0.9,<1",
    "wordfreq>=3.1,<4",
]

[project.optional-dependencies]
pruebas = [
    "pytest>=8.4,<10",
]
paridad = [
    # Rasterizar las páginas de los PDF para comparar, cuando los bytes no pueden coincidir.
    "PyMuPDF>=1.26,<3",
]

[tool.setuptools.packages.find]
include = ["itt_herramientas*"]

[tool.setuptools.package-data]
itt_herramientas = [
    "dominio/fuentes/*",
    "dominio/activos/*",
]

[tool.pytest.ini_options]
testpaths = ["itt_herramientas/pruebas", "paridad"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "paridad: compara contra la rama main del escritorio (corre con `pytest paridad`)",
]
