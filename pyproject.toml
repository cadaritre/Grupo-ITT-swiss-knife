[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "itt-herramientas-web"
version = "0.2.0"
description = "Herramientas Grupo ITT: cotizaciones, reportes fotográficos, croquis, convertidor y triangulación como app Django para el Portal TresVizo"
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Propietaria"
dependencies = [
    "tvplataforma>=1.8,<2",       # 1.5 navegación como datos y preferencias de tema; 1.8 al eliminar una cuenta (Drive)
    "Django>=5.2,<5.3",
    "Pillow>=12.2,<14",
    "reportlab>=4.4,<6",
    "ezdxf>=1.4,<2",
    "numpy>=2.0,<3",
    "pyproj>=3.7,<4",
    "Shapely>=2.1,<3",
    "pyspellchecker>=0.9,<1",
    "wordfreq>=3.1,<4",
    "cryptography>=44,<60",       # cifrado en reposo de los tokens de Google Drive
    "pypdf>=6.21,<7",             # CAD: une en un PDF las presentaciones que imprime el motor, una por una (BSD, Python puro)
]

[project.optional-dependencies]
pruebas = [
    "pytest>=8.4,<10",
    "pytest-django>=4.9",
]
navegador = [
    # luego: python -m playwright install chromium webkit
    "playwright>=1.50,<2",
]
paridad = [
    # Rasterizar las páginas de los PDF para comparar, cuando los bytes no pueden coincidir.
    "PyMuPDF>=1.26,<3",
]

# Desarrollo local: el contrato se toma de la ruta hermana (editable). En producción, del tag de Git del armazón.
[tool.uv.sources]
tvplataforma = { path = "../TresVizo-Portal/plataforma", editable = true }

[tool.setuptools.packages.find]
include = ["itt_herramientas*"]

[tool.setuptools.package-data]
itt_herramientas = [
    "dominio/fuentes/*",
    "dominio/activos/*",
    "templates/**/*",
    "static/**/*",
    "offline/*.tpl",
    "cad/editor/*.json",
    "cad/editor/*.html",
    "cad/editor/*.js",
    "cad/editor/*.css",
    "cad/plantillas/*",
    "civil/motor/*.json",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "itt_herramientas.pruebas.ajustes"
testpaths = ["itt_herramientas/pruebas", "itt_herramientas/pruebas_navegador", "paridad"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "navegador: corre en un navegador móvil con Playwright (bajo el candado de la máquina compartida)",
    "paridad: compara contra la rama main del escritorio (corre con `pytest paridad`)",
]
